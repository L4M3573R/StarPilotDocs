# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: StarPilot Docs
site_url: https://wiki.firestar.link
site_description: Documentation for the install and usage of StarPilot

nav:
  - General:
      - Getting Started:
          - Welcome to StarPilot: index.md
          - Installing StarPilot: software/starpilot.md
          - Vehicle Compatibility: cars/support.md
      - Usage:
          - Operation: usage/operation.md
          - Settings: usage/settings.md
          - Driving Model: usage/driving-model.md
          - Galaxy: usage/galaxy.md
      - Troubleshooting & FAQ:
          - Ticket System: ticketsystem.md
          - FAQ: faq.md
  - StarPilot Exclusive Features:
      - Navigation: exclusive/navigation.md
      - Lane Centering: exclusive/lane-centering.md
      - Speed Limit Controller: exclusive/speed-limit-controller.md
      - Sentry Mode: exclusive/sentry-mode.md
      - Bluetooth Controls: exclusive/bluetooth-controls.md
  - Vehicle Specific Information:
      - GM:
          - Bolt EV: cars/bolt.md
          - Volt & Other ASCM/SDGM Cars: cars/volt.md
      - Hyundai / Kia:
          - Long Setup for Some HDA2 Vehicles: cars/hkg-hda2-longitudinal.md
  - Comma Hardware Info:
      - Comma Devices: hardware/comma.md
      - Comma Installation:
          - Installing your Comma: install/comma.md
          - Mounting your Comma: install/mounting.md
      - Chestnut (External GPU): hardware/chestnut.md
      - Comma Pedal:
          - Pedal Information: hardware/comma-pedal.md
          - Pedal Installation: install/pedal.md
      - GM Harness: hardware/gm-harness.md
      - OBD-C Cable: hardware/obd-c.md
      - OBD Harness: hardware/obd-harness.md
    
theme:
  name: material
  custom_dir: overrides

  logo: assets/images/galaxy_frog.png
  favicon: assets/images/galaxy_frog.png

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.footer

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list

plugins:
  - search
  - social
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - git-committers:
      repository: StarPilot-Docs/docs
      branch: main
  - callouts
  - include-markdown

repo_url: https://github.com/firestar5683/StarPilot
repo_name: firestar5683/StarPilot

extra:
  status:
    experimental: Experimental feature
  social:
    - icon: fontawesome/brands/discord
      link: https://firestar.link/discord

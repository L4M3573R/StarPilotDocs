{% extends "base.html" %}

{% block content %}
  {{ super() }}

  <script
    data-goatcounter="https://starpilot-docs.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>
{% endblock %}

{% block footer %}
  {{ super() }}

  <div class="galaxy-theme-menu">
    <div class="galaxy-theme-menu__label">
      Theme
    </div>

    <button
      id="theme-default"
      class="galaxy-theme-option"
      type="button"
    >
      Default
    </button>

    <button
      id="theme-galaxy"
      class="galaxy-theme-option"
      type="button"
    >
      Galaxy
    </button>
  </div>
{% endblock %}
